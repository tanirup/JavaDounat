# アプリケーション名
spring.application.name=demo

# H2 データベース設定（ファイル保存にして再起動後も在庫を保持）
spring.datasource.url=jdbc:h2:file:./data/donutdb;AUTO_SERVER=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 コンソール（ブラウザから /h2-console で確認可能）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate 設定
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# SQL 初期化設定
#spring.sql.init.mode=always
#２回目以降
spring.sql.init.mode=never

# Thymeleaf 設定（開発中はキャッシュを無効化して変更を反映しやすくする）
spring.thymeleaf.cache=false
spring.sql.init.schema-locations=classpath:db/migration/schema.sql
spring.sql.init.data-locations=classpath:db/migration/data.sql
