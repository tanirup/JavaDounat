<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録</title>
  <link rel="stylesheet" href="/src/main/resources/static/style.css">
</head>

<!-- ★ 1. body に画面の高さを100%使い切る設定を追加 -->
<body style="min-height: 100vh; display: flex; flex-direction: column; margin: 0;">

  <header class="header">
    <h1>DONUT CAFE 🍩</h1>
    <nav>
      <a href="#">ホーム</a>
      <a href="#menu">商品一覧</a>
      <a href="#about">お店について</a>
      <a href="#contact">お問い合わせ</a>
    </nav>
  </header>
  
  <!-- ★ 2. flex: 1 で真ん中のエリアを限界まで広げ、余白（margin）も確保 -->
  <div class="card" style="text-align: center; flex: 1; margin: 40px auto;">
    <h2>新規登録</h2>

    <form action="#" method="POST">
      <div class="form-group" style="margin-bottom: 18px;">
        <label for="username" style="display: block; margin-bottom: 6px;">ユーザー名</label>
        <input type="text" id="username" name="username" placeholder="ユーザー名" required style="text-align: center;">
      </div>

      <div class="form-group" style="margin-bottom: 18px;">
        <label for="password" style="display: block; margin-bottom: 6px;">PW</label>
        <input type="password" id="password" name="password" placeholder="パスワード" required style="text-align: center;">
      </div>

      <div class="form-group" style="margin-bottom: 18px;">
        <label for="password-confirm" style="display: block; margin-bottom: 6px;">PW確認用</label>
        <input type="password" id="password-confirm" name="password-confirm" placeholder="パスワード確認" required style="text-align: center;">
      </div>

      <button type="submit" class="submit-btn">登録</button>
    </form>
  </div>

  <footer id="contact">
    <p>DONUT CAFE</p>
    <p>&copy; 2026 DONUT CAFE. All Rights Reserved.</p>
  </footer>

</body>
</html>
