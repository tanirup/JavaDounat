<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品一覧｜DONUT CAFE</title>
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css">
  <link rel="stylesheet" th:href="@{/hamburger.css(v=6)}" href="/hamburger.css?v=6">
  <script th:src="@{/hamburger.js}" src="/hamburger.js" defer></script>
</head>
<body>
  <header th:replace="~{fragments/header :: siteHeader}"></header>
  <main>
    <p th:replace="~{fragments/session-notice :: notice}"></p>
    <section class="menu">
      <h2>OUR DONUTS</h2>
      <p class="section-text">すべてのドーナツ一覧</p>
      <div class="donut-list">
        <article class="donut-card" th:each="item : ${items}">
          <a th:href="@{/items/{id}(id=${item.id})}" th:aria-label="${item.name + 'の詳細を見る'}">
            <img th:src="@{${item.imageUrl}}" th:alt="${item.name}" alt="ドーナツ画像">
          </a>
          <h3 th:text="${item.name}">商品名</h3>
          <p th:text="${item.description}">商品説明</p>
          <p class="price">¥<span th:text="${item.price}">320</span>（税込）</p>
          <a class="button" th:href="@{/items/{id}(id=${item.id})}" th:aria-label="${item.name + 'の詳細を見る'}">商品を見る</a>
        </article>
      </div>
    </section>
  </main>
  <footer><p>DONUT CAFE</p><p>&copy; 2026 DONUT CAFE. All Rights Reserved.</p></footer>
</body>
</html>
