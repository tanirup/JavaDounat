
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ログイン | DONUT CAFE</title>

  <!-- 共通CSS -->
  <link rel="stylesheet"
        th:href="@{/style.css}"
        href="/style.css">

  <!-- ログイン専用CSS -->
  <link rel="stylesheet"
        th:href="@{/login.css}"
        href="/login.css">
  <link rel="stylesheet" th:href="@{/hamburger.css(v=6)}" href="/hamburger.css?v=6">
  <script th:src="@{/hamburger.js}" src="/hamburger.js" defer></script>
</head>

<body class="login-page">

  <!-- ヘッダー -->
  <header th:replace="~{fragments/header :: siteHeader}"></header>

  <!-- ログイン画面 -->
  <main class="home-container login-section">
    <p th:replace="~{fragments/session-notice :: notice}"></p>

    <section class="home-card login-container" aria-labelledby="login-title">

      <div class="login-icon">🍩</div>

      <h2 id="login-title">LOGIN</h2>

      <p class="login-subtitle">
        おかえりなさい！<br>
        アカウントにログインしてください。
      </p>

      <!-- ログイン失敗 -->
      <p th:if="${param.profileUpdated}" class="success-message" role="status">
        プロフィールを保存しました。新しいメールアドレスでログインしてください。
      </p>
      <p th:if="${param.registered}" class="success-message" role="status">
        会員登録が完了しました。登録したメールアドレスとパスワードでログインしてください。
      </p>
      <p th:if="${param.error}"
         class="error-message" role="alert">
        メールアドレスまたはパスワードが違います。
      </p>

      <!-- ログアウト完了 -->
      <p th:if="${param.logout}"
         class="success-message" role="status">
        ログアウトしました。
      </p>

      <!-- ログインフォーム -->
      <form th:action="@{/login}"
            action="/login"
            method="post">

        <!-- メールアドレス -->
        <div class="form-group">

          <label for="email">
            メールアドレス
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
            required>

        </div>

        <!-- パスワード -->
        <div class="form-group">

          <label for="password">
            パスワード
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="パスワードを入力"
            autocomplete="current-password"
            required>

        </div>

        <!-- パスワード再設定 -->
        <div class="forgot-password">
          <a th:href="@{/forgot-password}"
             href="/forgot-password">
            パスワードをお忘れですか？
          </a>
        </div>

        <!-- ログインボタン -->
        <button type="submit"
                class="button login-button">
          ログイン
        </button>

      </form>

      <!-- 新規会員登録 -->
      <p class="register-text">
        アカウントをお持ちでない方
        <a th:href="@{/register}"
           href="/register">
          新規会員登録
        </a>
      </p>

      <!-- ホーム画面に戻る -->
      <p class="register-text">
        <a th:href="@{/}"
           href="/">
          ホーム画面に戻る
        </a>
      </p>

    </section>

  </main>

  <!-- フッター -->
  <footer id="contact">
    <p>DONUT CAFE</p>
    <p>
      &copy; 2026 DONUT CAFE.
      All Rights Reserved.
    </p>
  </footer>

</body>
</html>
