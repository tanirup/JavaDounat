
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ログイン | DONUT CAFE</title>

  <!-- 共通CSS -->
  <link rel="stylesheet"
        th:href="@{/style.css}"
        href="/style.css">

  <!-- ログイン専用CSS -->
  <link rel="stylesheet"
        th:href="@{/login.css}"
        href="/login.css">
</head>

<body>

  <!-- ヘッダー -->
  <header class="header">
    <h1>DONUT CAFE 🍩</h1>

    <nav>
      <a th:href="@{/index.html}" href="/index.html">
        ホーム
      </a>

      <a th:href="@{/index.html#menu}"
         href="/index.html#menu">
        商品一覧
      </a>

      <a th:href="@{/index.html#about}"
         href="/index.html#about">
        お店について
      </a>

      <a th:href="@{/index.html#contact}"
         href="/index.html#contact">
        お問い合わせ
      </a>
    </nav>
  </header>

  <!-- ログイン画面 -->
  <main class="login-section">

    <div class="login-container">

      <div class="login-icon">🍩</div>

      <h2>LOGIN</h2>

      <p class="login-subtitle">
        おかえりなさい！<br>
        アカウントにログインしてください。
      </p>

      <!-- ログイン失敗 -->
      <p th:if="${param.error}"
         class="error-message">
        メールアドレスまたはパスワードが違います。
      </p>

      <!-- ログアウト完了 -->
      <p th:if="${param.logout}"
         class="success-message">
        ログアウトしました。
      </p>

      <!-- ログインフォーム -->
      <form th:action="@{/login}"
            action="/login"
            method="post">

        <!-- CSRF対策 -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <!-- メールアドレス -->
        <div class="form-group">

          <label for="email">
            メールアドレス
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
            required>

        </div>

        <!-- パスワード -->
        <div class="form-group">

          <label for="password">
            パスワード
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="パスワードを入力"
            autocomplete="current-password"
            required>

        </div>

        <!-- パスワード再設定 -->
        <div class="forgot-password">
          <a th:href="@{/forgot-password}"
             href="/forgot-password">
            パスワードをお忘れですか？
          </a>
        </div>

        <!-- ログインボタン -->
        <button type="submit"
                class="login-button">
          ログイン
        </button>

      </form>

      <!-- 新規会員登録 -->
      <p class="register-text">
        アカウントをお持ちでない方
        <a th:href="@{/register}"
           href="/register">
          新規会員登録
        </a>
      </p>

      <!-- ホーム画面に戻る -->
      <p class="register-text">
        <a th:href="@{/index.html}"
           href="/index.html">
          ホーム画面に戻る
        </a>
      </p>

    </div>

  </main>

  <!-- フッター -->
  <footer id="contact">
    <p>DONUT CAFE</p>
    <p>
      &copy; 2026 DONUT CAFE.
      All Rights Reserved.
    </p>
  </footer>

</body>
</html>
