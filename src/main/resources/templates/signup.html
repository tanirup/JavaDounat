<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規会員登録 | DONUT CAFE</title>
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css">
  <link rel="stylesheet" th:href="@{/login.css}" href="/login.css">
  <link rel="stylesheet" th:href="@{/hamburger.css(v=6)}" href="/hamburger.css?v=6">
  <script th:src="@{/hamburger.js}" src="/hamburger.js" defer></script>
</head>

<body class="login-page">

  <header th:replace="~{fragments/header :: siteHeader}"></header>
  
  <main class="home-container login-section">
    <p th:replace="~{fragments/session-notice :: notice}"></p>
    <section class="home-card login-container" aria-labelledby="signup-title">
    <h2 id="signup-title">新規会員登録</h2>

    <!-- エラーメッセージ表示 -->
    <p th:if="${errorMessage}" th:text="${errorMessage}" class="error-message" role="alert"></p>

    <form th:action="@{/register}" th:object="${registration}" action="/register" method="post" onsubmit="return checkPassword()">
      <div th:if="${#fields.hasAnyErrors()}" class="error-message" role="alert">
        <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
      </div>
      <div class="form-group">
        <label for="name">ユーザー名</label>
        <input type="text" id="name" name="name" th:value="${registration.name}" maxlength="100" autocomplete="name" placeholder="ユーザー名" required>
      </div>

      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" th:value="${registration.email}" maxlength="254" autocomplete="email" placeholder="example@mail.com" required>
      </div>

      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="8文字以上のパスワード" required>
      </div>

      <div class="form-group">
        <label for="password-confirm">パスワード（確認用）</label>
        <input type="password" id="password-confirm" name="passwordConfirm" autocomplete="new-password" placeholder="パスワード確認" required>
      </div>

      <button type="submit" class="button login-button">登録</button>
    </form>

    <p class="register-text">
      アカウントをお持ちの方
      <a th:href="@{/login}" href="/login">ログイン</a>
    </p>
    <p class="register-text">
      <a th:href="@{/}" href="/">ホーム画面に戻る</a>
    </p>
    </section>
  </main>

  <footer id="contact">
    <p>DONUT CAFE</p>
    <p>&copy; 2026 DONUT CAFE. All Rights Reserved.</p>
  </footer>

  <script>
    function checkPassword() {
      const pw = document.getElementById('password').value;
      const pwConfirm = document.getElementById('password-confirm').value;
      if (pw !== pwConfirm) {
        alert('パスワードが一致しません。');
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
