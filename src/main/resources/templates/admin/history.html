<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文・発注履歴 - DONUT CAFE</title>
    <link rel="stylesheet" th:href="@{/donut-cafe.css}">
</head>
<body>
    <div class="wrap">
        <div class="top-title">
            <span>DONUT CAFE ADMIN</span>
            <h1>注文・発注履歴一覧</h1>
        </div>

        <div class="admin-nav">
            <a th:href="@{/admin/dashboard}" class="btn-pay">← ダッシュボードへ戻る</a>
            <a th:href="@{/admin/inventory}" class="btn-home">在庫管理・発注へ進む →</a>
        </div>

        <!-- 全体の注文履歴 -->
        <div class="box history-board">
            <h2 class="items-heading">全体の注文履歴</h2>
            <p class="empty-msg" th:if="${#lists.isEmpty(orderHistory)}">まだ注文履歴はありません。</p>
            <table th:if="${!#lists.isEmpty(orderHistory)}">
                <thead>
                    <tr>
                        <th>日時</th>
                        <th>注文内容</th>
                        <th>支払方法</th>
                        <th class="right">合計</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${orderHistory}">
                        <td th:text="${entry.orderedAt}">2026/11/19 15:00</td>
                        <td>
                            <span th:each="line, stat : ${entry.itemSummary}">
                                <span th:text="${line}">ドーナツ × 1</span><span th:if="${!stat.last}">、</span>
                            </span>
                        </td>
                        <td th:text="${entry.paymentMethod}">クレジットカード（疑似）</td>
                        <td class="right"><strong th:text="${entry.totalPrice} + '円'">300円</strong></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 発注履歴 -->
        <div class="box history-board">
            <h2 class="items-heading">発注履歴</h2>
            <p class="empty-msg" th:if="${#lists.isEmpty(stockOrderHistory)}">まだ発注履歴はありません。</p>
            <table th:if="${!#lists.isEmpty(stockOrderHistory)}">
                <thead>
                    <tr>
                        <th>日時</th>
                        <th>商品名</th>
                        <th class="right">発注数</th>
                        <th class="right">発注後在庫</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${stockOrderHistory}">
                        <td th:text="${entry.orderedAt}">2026/11/19 15:00</td>
                        <td th:text="${entry.itemName}">ドーナツ</td>
                        <td class="right"><strong th:text="'+' + ${entry.orderQuantity} + ' 個'">+20 個</strong></td>
                        <td class="right" th:text="${entry.stockAfterOrder} + ' 個'">30 個</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
