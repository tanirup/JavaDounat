<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理ダッシュボード｜DONUT CAFE</title>
  <link rel="stylesheet" th:href="@{/style.css}">
  <style>
    .admin-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .admin-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(91, 64, 56, 0.05);
    }
    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #f0e9e1;
      font-size: 14px;
    }
    th {
      background-color: #f5f0eb;
      color: #5b4038;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>DONUT CAFE 🍩 <span style="font-size: 14px; color: #8c7365;">管理画面</span></h1>
    <nav>
      <a th:href="@{/admin/logout}" style="color: #d96b87;">ログアウト</a>
    </nav>
  </header>

  <main>
    <div class="admin-container">
      <div class="admin-header-flex">
        <h2>商品・在庫管理ダッシュボード</h2>
        <!-- 必要に応じて商品追加画面へのリンクなどを置けます -->
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>商品名</th>
            <th>価格</th>
            <th>在庫数</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="item : ${items}">
            <td th:text="${item.id}">1</td>
            <td th:text="${item.name}">商品名</td>
            <td>¥<span th:text="${item.price}">0</span></td>
            <td th:text="${item.stockQuantity}">0</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>DONUT CAFE Admin</p>
  </footer>

</body>
</html>
